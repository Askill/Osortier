<text x="324" y="268" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#121212" text-anchor="middle" >Kafka partitions</text>
<rect x="432" y="322" width="124" height="30" fill="#fff" fill-opacity="0.92" stroke="#6E7A8A"/>
<text x="494" y="342" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#121212" text-anchor="middle" >retries</text>
<rect x="290" y="404" width="124" height="30" fill="#fff" fill-opacity="0.92" stroke="#6E7A8A"/>
<text x="352" y="424" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#121212" text-anchor="middle" >parallel workers</text>
<rect x="440" y="484" width="124" height="30" fill="#fff" fill-opacity="0.92" stroke="#6E7A8A"/>
<text x="502" y="504" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#121212" text-anchor="middle" >batches in S3</text>
<rect x="640" y="226" width="150" height="300" fill="#fff" stroke="#E3120B" stroke-width="2"/>
<text x="715" y="368.0" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="18" font-weight="700" fill="#121212" text-anchor="middle" >Osortier</text>
<text x="715" y="390.0" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="middle" >stateless,</text>
<text x="715" y="406.0" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="middle" >one thread, O(n)</text>
<rect x="850" y="226" width="118" height="300" fill="#fff" stroke="#121212"/>
<text x="909" y="368.0" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#121212" text-anchor="middle" >Applies</text>
<text x="909" y="386.0" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="middle" >transactions to</text>
<text x="909" y="402.0" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="middle" >account state</text>
<text x="32" y="550" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#121212" text-anchor="start" >Owns the account state.</text>
<text x="32" y="566" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="start" >Numbers each account's</text>
<text x="32" y="582" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="start" >transactions without gaps.</text>
<text x="250" y="550" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#121212" text-anchor="start" >At-least-once and unordered.</text>
<text x="250" y="566" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="start" >Nothing here has to keep order</text>
<text x="250" y="582" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="start" >or hold a lock.</text>
<text x="640" y="550" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#121212" text-anchor="start" >Keeps nothing between runs.</text>
<text x="640" y="566" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="start" >Needs no database.</text>
<text x="850" y="550" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="700" fill="#121212" text-anchor="start" >Needs every account</text>
<text x="850" y="566" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="start" >in exact sequence.</text>
<line x1="32" y1="611" x2="968" y2="611" stroke="#D8D8D8"/>
<text x="32" y="632" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12" font-weight="400" fill="#6E7A8A" text-anchor="start" >Schematic. Strands are transactions, coloured by one of their accounts. Producer and system names are examples.</text>
</svg>