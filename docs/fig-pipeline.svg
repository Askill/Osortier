<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<rect width="1000" height="650" fill="#FFFFFF"/>
<text x="32" y="36" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#6E7A8A" text-anchor="start" letter-spacing="1.9">FIGURE 1</text>
<text x="32" y="74" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="30" font-weight="700" fill="#121212" text-anchor="start" >Where the disorder comes from</text>
<text x="32" y="106" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="18" font-weight="400" fill="#3A3A3A" text-anchor="start" >Each producer owns its accounts and numbers their transactions in order. Anything</text>
<text x="32" y="131" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="18" font-weight="400" fill="#3A3A3A" text-anchor="start" >between producer and consumer may reorder them. Osortier puts them back in order.</text>
<text x="32" y="204" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#6E7A8A" text-anchor="start" letter-spacing="1.6">PRODUCERS</text>
<text x="250" y="204" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#6E7A8A" text-anchor="start" letter-spacing="1.6">TRANSPORT AND PROCESSING</text>
<text x="640" y="204" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#6E7A8A" text-anchor="start" letter-spacing="1.6">OSORTIER</text>
<text x="850" y="204" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="11" font-weight="700" fill="#6E7A8A" text-anchor="start" letter-spacing="1.6">CONSUMER</text>
<rect x="32" y="240" width="138" height="56" fill="#fff" stroke="#121212"/>
