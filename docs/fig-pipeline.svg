<text x="44" y="283" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="start" >accounts a, b</text>
<rect x="32" y="348" width="138" height="56" fill="#fff" stroke="#121212"/>
<text x="44" y="371" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#121212" text-anchor="start" >Producer 2</text>
<text x="44" y="391" font-family="Helvetica,Arial,'Segoe UI',sans-serif" font-size="12.5" font-weight="400" fill="#586173" text-anchor="start" >accounts c, d</text>
